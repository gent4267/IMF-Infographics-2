<title>The Bangkok Briefing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,560;0,9..144,650;1,9..144,500&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root{
    --navy:#212A3B;
    --rust:#A15A3A;
    --rust-bright:#BD6C46;
    --plant:#4B6B4E;
    --paper:#F4EEDD;
    --paper-2:#EADFC2;
    --ink:#241C12;
    --ink-soft:#5C513D;
    --line:rgba(33,42,59,0.16);
    --shadow:rgba(40,30,15,0.28);

    --fs-eyebrow:clamp(0.68rem,0.63rem + 0.2vw,0.76rem);
    --fs-body:clamp(1rem,0.95rem + 0.2vw,1.08rem);
    --fs-h1:clamp(2.4rem,1.8rem + 2.8vw,3.9rem);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:linear-gradient(180deg,#E9DEC0,#D9C7A0);
    color:var(--ink);
    font-family:'Newsreader',Georgia,'Times New Roman',serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--rust); outline-offset:3px;}

  .eyebrow{
    font-family:'Space Mono',ui-monospace,monospace;
    font-size:var(--fs-eyebrow);
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--rust);
  }

  .app-shell{
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }


  main#app{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 20px 44px;
  }

  .screen{
    width:100%;
    max-width:880px;
    animation:rise .5s ease both;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }

  .scene-art{ width:100%; display:block; }
  .scene-art svg{ width:100%; height:auto; display:block; }
  .hero-photo{ position:relative; }
  .hero-photo img{ width:100%; height:auto; display:block; }

  /* ---------- Folder option chips ---------- */
  .bubble-chip{
    display:flex; align-items:center; gap:8px;
    background:transparent; border:0; border-radius:6px;
    padding:4px 8px; text-align:left; cursor:pointer;
    font-family:'Newsreader',serif; font-size:0.82rem; line-height:1.25; color:var(--ink);
    transition:background .15s ease;
  }
  .bubble-chip:hover{ background:rgba(161,90,58,0.1); }
  .bubble-chip.chosen{ background:rgba(75,107,78,0.14); }
  .bubble-chip.chosen .chip-tag{ background:var(--plant); border-color:var(--plant); color:var(--paper); }
  .chip-tag{
    flex:none; width:18px; height:18px; border-radius:50%;
    border:1px solid rgba(33,42,59,0.35);
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Mono',monospace; font-size:0.62rem; color:var(--ink-soft);
    transition:background .15s ease, border-color .15s ease, color .15s ease;
  }
  /* ---------- Cover ---------- */
  .cover{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:20px; }
  .cover .scene-art{ max-width:760px; filter:drop-shadow(0 22px 40px var(--shadow)); }
  .cover h1{
    font-family:'Fraunces',Georgia,serif;
    font-weight:650;
    font-size:var(--fs-h1);
    line-height:1.02;
    margin:0;
    text-wrap:balance;
    color:var(--ink);
  }
  .cover .sub{
    font-style:italic;
    font-size:var(--fs-body);
    color:var(--ink-soft);
    max-width:46ch;
    margin:0;
    line-height:1.55;
  }
  .disclaimer{
    font-family:'Space Mono',monospace; font-style:normal;
    font-size:0.68rem; letter-spacing:0.02em; line-height:1.5;
    color:var(--ink-soft);
    opacity:0.8;
    max-width:52ch;
    margin:0;
  }
  .dossier .disclaimer{ padding:12px 16px; background:var(--paper); }

  .btn{
    font-family:'Space Mono',monospace;
    font-size:0.82rem;
    letter-spacing:0.06em;
    text-transform:uppercase;
    border-radius:2px;
    padding:14px 26px;
    cursor:pointer;
    border:1px solid transparent;
    transition:transform .15s ease, background .15s ease, color .15s ease, border-color .15s ease;
  }
  .btn-primary{ background:var(--rust); color:var(--paper); }
  .btn-primary:hover{ background:var(--rust-bright); transform:translateY(-1px); }
  .btn-primary:disabled{ background:#C9BB99; color:#8B7F63; cursor:not-allowed; opacity:0.7; transform:none; }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border-color:rgba(33,42,59,0.3); }
  .btn-ghost:hover{ color:var(--ink); border-color:var(--navy); }

  /* ---------- Dossier (unified scene + content card) ---------- */
  .dossier{
    background:var(--paper);
    border:1px solid rgba(33,42,59,0.14);
    box-shadow:0 26px 50px var(--shadow);
    overflow:hidden;
  }
  .nav-row{ display:flex; justify-content:space-between; align-items:center; margin-top:22px; }

  /* ---------- Scene HUD: nav overlaid on the photo (results screen) ---------- */
  .btn-onphoto{ color:#F4EEDD; border-color:rgba(244,238,221,0.55); }
  .btn-onphoto:hover{ color:#fff; border-color:#fff; }

  .lang-toggle{
    position:fixed; top:14px; right:14px; z-index:40;
    font-family:'Space Mono',monospace; font-size:0.72rem; letter-spacing:0.06em; text-transform:uppercase;
    background:rgba(10,8,4,0.55); color:#F4EEDD;
    border:1px solid rgba(244,238,221,0.45); border-radius:3px;
    padding:7px 12px; cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
  }
  .lang-toggle:hover{ color:#fff; border-color:#fff; }

  /* ---------- Speech bubble: the delivery, anchored on the speaker ---------- */
  .speech-bubble{
    position:absolute;
    background:var(--paper);
    border:1.5px solid var(--navy);
    border-radius:12px;
    box-shadow:0 10px 22px rgba(20,15,5,0.3);
    padding:10px 12px;
    animation:bubbleIn .35s cubic-bezier(.2,.9,.3,1.3) both;
  }
  @keyframes bubbleIn{ from{ opacity:0; transform:scale(0.85) translateY(6px); } to{ opacity:1; transform:scale(1) translateY(0); } }
  .bubble-tail{
    position:absolute; left:26px; bottom:-13px; width:0; height:0;
    border-left:9px solid transparent; border-right:9px solid transparent;
    border-top:14px solid var(--navy);
  }
  .bubble-tail:after{
    content:''; position:absolute; left:-7px; top:-15px; width:0; height:0;
    border-left:7px solid transparent; border-right:7px solid transparent;
    border-top:12px solid var(--paper);
  }
  .speech-bubble.delivery{
    width:min(340px,40%);
    animation:none;
    font-family:'Newsreader',serif;
    font-style:italic;
    font-size:0.88rem;
    line-height:1.48;
    color:var(--ink);
    padding:12px 14px;
  }
  .speech-bubble.delivery .deliv-scroll{
    max-height:24vh;
    overflow-y:auto;
    scroll-behavior:smooth;
    overflow-wrap:break-word;
    word-break:break-word;
  }
  .speech-bubble.delivery .deliv-tag{
    display:block;
    font-family:'Space Mono',ui-monospace,monospace;
    font-size:0.6rem; letter-spacing:0.1em; text-transform:uppercase;
    font-style:normal; color:var(--rust-bright); opacity:0.85;
    margin-bottom:5px;
  }
  .speech-bubble.delivery .kw{ color:var(--rust); font-weight:700; font-style:normal; }
  .speech-bubble.delivery .fill{ color:var(--plant); font-weight:700; font-style:normal; background:rgba(75,107,78,0.14); padding:0 3px; border-radius:3px; }

  .speech-bubble.aside{
    position:relative;
    max-width:190px;
    font-family:'Newsreader',serif; font-style:italic;
    font-size:0.78rem; line-height:1.4;
    color:var(--ink);
    padding:9px 11px;
  }
  .delivery-aside-host{
    position:absolute;
    transform:translateX(-50%);
    z-index:5;
  }

  .delivery-reaction{
    position:absolute; left:14px; bottom:14px; max-width:56%;
    background:rgba(10,8,4,0.55); color:#F4EEDD;
    font-family:'Space Mono',monospace; font-style:normal;
    font-size:0.68rem; letter-spacing:0.03em; line-height:1.5;
    padding:8px 12px; border-radius:6px;
    min-height:1.2em;
  }
  .delivery-actions{ position:absolute; right:14px; bottom:14px; }

  /* ---------- Folder scene: filling in the blanks, off the podium ---------- */
  .folder-scene{
    background:var(--paper);
    padding:clamp(32px,5vw,54px) clamp(20px,4vw,40px) clamp(24px,4vw,36px);
  }
  .folder-tab{
    display:inline-block;
    max-width:calc(100% - 8px);
    background:var(--paper-2);
    border:1px solid rgba(33,42,59,0.18);
    border-bottom:none;
    border-radius:8px 10px 0 0;
    padding:7px 16px;
    margin-left:20px;
    font-family:'Space Mono',monospace; font-size:0.64rem; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--ink-soft);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .folder{
    position:relative;
    background:var(--paper-2);
    border:1px solid rgba(33,42,59,0.18);
    border-radius:2px 12px 12px 12px;
    box-shadow:0 22px 40px var(--shadow);
    padding:22px;
  }
  .folder-punch{
    position:absolute; top:12px; width:11px; height:11px; border-radius:50%;
    background:var(--paper);
    box-shadow:inset 0 2px 3px rgba(40,30,15,0.35);
  }
  .folder-punch.a{ left:24px; }
  .folder-punch.b{ right:24px; }
  .folder-doc{
    background:var(--paper);
    border:1px solid rgba(33,42,59,0.12);
    box-shadow:0 8px 18px rgba(40,30,15,0.1);
    padding:24px 22px 18px;
    margin-top:8px;
  }
  .folder-doc .q-target{
    font-style:italic; font-size:1.05rem; line-height:1.55; color:var(--ink); min-height:1.4em;
  }
  .folder-doc .kw{ color:var(--rust); font-weight:700; font-style:normal; }
  .folder-doc .fill{ color:var(--plant); font-weight:700; font-style:normal; background:rgba(75,107,78,0.14); padding:0 3px; border-radius:3px; }
  .folder-options{ display:flex; flex-direction:column; gap:3px; margin-top:14px; }
  .folder-options .bubble-chip{ border:1px solid transparent; }
  .folder-options .bubble-chip:hover{ background:rgba(161,90,58,0.1); border-color:rgba(161,90,58,0.22); }
  .folder-options .bubble-chip.chosen{ background:rgba(75,107,78,0.14); border-color:rgba(75,107,78,0.32); }
  .folder-actions{ display:flex; justify-content:space-between; align-items:center; margin-top:18px; }

  /* ---------- Narrative overlay: dimmed photo + text on top ---------- */
  .scene-dim{ position:absolute; inset:0; background:rgba(8,6,3,0.68); }
  .scene-narrative{
    position:absolute; inset:0;
    display:flex; flex-direction:column; justify-content:center;
    padding:clamp(22px,5vw,56px);
    gap:12px;
    max-width:640px;
  }
  .scene-narrative .eyebrow{ color:var(--rust-bright); }
  .scene-narrative p{
    color:#F4EEDD; font-size:0.96rem; line-height:1.6; margin:0;
    text-shadow:0 1px 4px rgba(0,0,0,0.4);
  }
  .narrative-title{
    font-family:'Fraunces',Georgia,serif; font-weight:650;
    font-size:clamp(1.6rem,1.3rem + 1.6vw,2.3rem);
    color:#F8F2E2; margin:0; text-wrap:balance;
    text-shadow:0 2px 10px rgba(0,0,0,0.5);
  }
  .score-line{
    font-family:'Space Mono',monospace; font-style:normal;
    font-size:0.92rem; letter-spacing:0.03em;
    color:var(--rust-bright) !important; text-shadow:none !important;
  }
  .narrative-actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; }

  /* ---------- Modal (transcript / historical note) ---------- */
  .modal-backdrop{
    position:fixed; inset:0; z-index:50;
    background:rgba(8,6,3,0.72);
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    animation:rise .2s ease both;
  }
  .modal-card{
    position:relative;
    background:var(--paper);
    max-width:600px; width:100%; max-height:80vh; overflow-y:auto;
    padding:clamp(24px,4vw,40px);
    box-shadow:0 30px 60px rgba(0,0,0,0.4);
  }
  .modal-card h3{
    font-family:'Fraunces',Georgia,serif; font-weight:650; color:var(--ink);
    font-size:1.3rem; margin:0 0 14px; text-wrap:balance;
  }
  .modal-card p{ line-height:1.75; color:var(--ink); margin:0 0 1em; }
  .modal-card .kw{ color:var(--rust); }
  .modal-card .fill{ color:var(--plant); background:rgba(75,107,78,0.14); padding:0 3px; border-radius:3px; }
  .modal-card p:last-child{ margin-bottom:0; }
  .modal-close{
    position:absolute; top:14px; right:14px;
    width:30px; height:30px; border-radius:50%;
    background:transparent; border:1px solid rgba(33,42,59,0.3);
    color:var(--ink-soft); cursor:pointer; font-size:1rem; line-height:1;
  }
  .modal-close:hover{ border-color:var(--navy); color:var(--ink); }
</style>

<button id="langToggle" class="lang-toggle" type="button"></button>
<div class="app-shell">
  <main id="app"></main>
</div>
<div id="modalRoot"></div>

<script>
(function(){

  var SECTIONS_EN = [
    {
      kicker: 'Section I of VI — Economic Transition',
      prompt: 'Here’s what’s actually driving Thailand’s <b class="kw">economic transition</b> into the 1990s: _____',
      speechPrompt: 'On the shape of our economy today: _____',
      options: [
        { tag:'A', fill:'Export-oriented manufacturing, replacing Thailand’s old dependence on agriculture and raw resources.',
          tags:{acc:1}, note:'This matches the Prime Minister’s own description in his welcome address to this same room: “Thailand has made a dramatic transition from an agricultural and resource-based economy into a more dynamic export-led economy.”' },
        { tag:'B', fill:'Foreign aid and World Bank lending, which by 1991 funded the majority of Thai industry and kept the private sector on the sidelines.',
          tags:{acc:0}, note:'False — foreign aid was never close to the majority funding source; the boom was led by private capital and export markets.' },
        { tag:'C', fill:'State-owned enterprises, which produced most of Thailand’s exports and left private manufacturers a minor role in the boom.',
          tags:{acc:0}, note:'False — Thailand’s export boom was led by the private sector, not state-owned firms.' },
        { tag:'D', fill:'Newly discovered offshore oil reserves in the Gulf of Thailand, which by 1991 had turned the kingdom into a net energy exporter.',
          tags:{acc:0}, note:'False — Thailand had no such reserves driving this growth; it remained a net oil importer.' }
      ]
    },
    {
      kicker: 'Section II of VI — Poverty and Inequality',
      prompt: 'Here’s what’s actually true about <b class="kw">poverty</b> in Thailand despite the decade of growth: _____',
      speechPrompt: 'But not everyone has felt that growth equally: _____',
      options: [
        { tag:'A', fill:'Roughly a quarter of Thais still lived below the poverty line, concentrated heavily in the rural Northeast.',
          tags:{acc:1}, note:'This is the real picture, and it’s what the Prime Minister himself acknowledged in his address, calling for development with “a human face” because — in his own words — “not all Thais have fully enjoyed the fruits of success.”' },
        { tag:'B', fill:'Poverty had been completely eliminated nationwide by 1991, with no region reporting incomes below the poverty line.',
          tags:{acc:0}, note:'False — poverty remained a serious, widely acknowledged problem, including by the Prime Minister himself.' },
        { tag:'C', fill:'Poverty was worst in Bangkok, not in the rural provinces, where incomes had already caught up with the capital.',
          tags:{acc:0}, note:'False — poverty was concentrated in the rural Northeast, not the capital.' },
        { tag:'D', fill:'The poverty rate had actually risen over the previous decade of growth, wiping out the gains from years of rapid exports.',
          tags:{acc:0}, note:'False — poverty rates had been falling overall through the 1980s, even as regional gaps remained.' }
      ]
    },
    {
      kicker: 'Section III of VI — Resource Mobilization',
      prompt: 'Here’s what’s actually true about the competition for global capital in 1991: _____',
      speechPrompt: 'Beyond our borders, the competition for capital is shifting: _____',
      options: [
        { tag:'A', fill:'The Soviet Union had just been granted special association status with the IMF, and Eastern Europe’s opening was creating new competition for the capital developing Asia relied on.',
          tags:{acc:1}, note:'This lines up with the Prime Minister’s own warning to this room about “a continuing strain on resource mobilization,” in a passage that named Eastern Europe’s transformation as one of the competing claims on the same pool of capital.' },
        { tag:'B', fill:'The Soviet Union had already become a full IMF member with voting rights, on equal footing with every other country in the room.',
          tags:{acc:0}, note:'False — it held special association status only, a meaningfully smaller step than membership.' },
        { tag:'C', fill:'Global capital markets in 1991 had no shortage of funds for developing countries, leaving Asia with no real competition for capital.',
          tags:{acc:0}, note:'False — resource mobilization was widely flagged as strained, including by the Prime Minister himself.' },
        { tag:'D', fill:'Eastern Europe’s economic opening had no real effect on capital available to Asia, since the two regions drew on separate pools of funding.',
          tags:{acc:0}, note:'False — the opposite was the real concern in the room: that Eastern Europe would compete with Asia for the same capital.' }
      ]
    },
    {
      kicker: 'Section IV of VI — Trade & the Uruguay Round',
      prompt: 'Here’s what’s actually true about the <b class="kw">Uruguay Round</b> trade talks in 1991: _____',
      speechPrompt: 'Trade talks tell a similar story of unfinished business: _____',
      options: [
        { tag:'A', fill:'The talks were stalled, largely over disagreements on agricultural subsidies, with Thailand pushing to break the deadlock as a founding member of the Cairns Group.',
          tags:{acc:1}, note:'This matches the Prime Minister’s own assessment to this room: “The failure to reach an accord in the Uruguay Round is but a clear reminder that the actions taken so far fell short.”' },
        { tag:'B', fill:'The Uruguay Round had already concluded successfully by 1991, with a new global trade agreement already in force.',
          tags:{acc:0}, note:'False — the Round remained stalled at the time and would not conclude until 1994.' },
        { tag:'C', fill:'Thailand opposed agricultural trade liberalization to protect its own farmers from cheaper imported rice and sugar.',
          tags:{acc:0}, note:'False — Thailand was pushing to open agricultural markets, not shield its own.' },
        { tag:'D', fill:'The talks covered manufacturing tariffs exclusively, with agriculture left off the table from the very start.',
          tags:{acc:0}, note:'False — agriculture was the central sticking point of the Round.' }
      ]
    },
    {
      kicker: 'Section V of VI — Regional Cooperation',
      prompt: 'Here’s what’s actually true about Thailand’s <b class="kw">regional trade strategy</b> in 1991: _____',
      speechPrompt: 'Closer to home, we have been thinking bigger: _____',
      options: [
        { tag:'A', fill:'Thailand was pushing for an ASEAN Free Trade Area — a real proposal that became an actual agreement a few months later, in January 1992.',
          tags:{acc:1}, note:'The Prime Minister floated this exact proposal in his address: “the creation, among the six member countries of ASEAN, of an ASEAN Free Trade Area within 15 years” — and it wasn’t just talk.' },
        { tag:'B', fill:'Thailand proposed withdrawing from ASEAN entirely, arguing bilateral deals with individual neighbors would serve it better.',
          tags:{acc:0}, note:'False — Thailand was a founding ASEAN member with no intention of leaving.' },
        { tag:'C', fill:'ASEAN had already formed a full customs union by 1991, with a single external tariff applied across all six member states.',
          tags:{acc:0}, note:'False — ASEAN had no such union at the time; the free trade area itself was still just a proposal.' },
        { tag:'D', fill:'The regional proposal centered on a shared ASEAN currency, modeled loosely on plans then circulating in Western Europe.',
          tags:{acc:0}, note:'False — no currency union was ever part of the proposal.' }
      ]
    },
    {
      kicker: 'Section VI of VI — The Environment',
      prompt: 'Here’s what’s actually true about Thailand’s <b class="kw">environmental record</b> heading into 1991: _____',
      speechPrompt: 'And growth has come with a cost we cannot ignore: _____',
      options: [
        { tag:'A', fill:'Thailand had banned commercial logging nationwide in 1989, after deadly floods linked to illegal logging — even as Bangkok’s own pollution and traffic kept getting worse.',
          tags:{acc:1}, note:'This is the honest picture, and it fits the urgency in the Prime Minister’s own words to this room: “The rapid degradation of nature and the environment has put our common global heritage in grave peril.”' },
        { tag:'B', fill:'Thailand had no meaningful environmental regulations of any kind, leaving logging and industrial waste entirely unchecked.',
          tags:{acc:0}, note:'False — the 1989 nationwide logging ban was one of the most significant environmental policy moves in Southeast Asia at the time.' },
        { tag:'C', fill:'Bangkok’s air quality had improved dramatically by 1991, as new emissions rules took hold across the city.',
          tags:{acc:0}, note:'False — Bangkok’s pollution and traffic were getting worse in this period, not better, as the city outgrew its infrastructure.' },
        { tag:'D', fill:'The logging ban applied to a single province, leaving commercial logging legal everywhere else in the country.',
          tags:{acc:0}, note:'False — the 1989 ban was nationwide.' }
      ]
    }
  ];

  var SECTIONS_TH = [
    {
      kicker: 'หมวดที่ 1 จาก 6 — การเปลี่ยนผ่านทางเศรษฐกิจ',
      prompt: 'นี่คือสิ่งที่กำลังขับเคลื่อน<b class="kw">การเปลี่ยนผ่านทางเศรษฐกิจ</b>ของไทยเข้าสู่ทศวรรษ 1990 จริง ๆ: _____',
      speechPrompt: 'ว่าด้วยรูปโฉมของเศรษฐกิจไทยในวันนี้: _____',
      options: [

  function t(key){ return STR[state.lang][key]; }

  var audioCtx = null;
  function getAudioCtx(){
    if(!audioCtx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(AC){ audioCtx = new AC(); }
    }
    if(audioCtx && audioCtx.state === 'suspended'){ audioCtx.resume(); }
    return audioCtx;
  }

  function playTone(ctx, freq, duration, startGain, delay){
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    var t0 = ctx.currentTime + (delay || 0);
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(startGain, t0 + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
  }

  function playSelectSound(){
    var ctx = getAudioCtx();
    if(!ctx) return;
    playTone(ctx, 660, 0.09, 0.06, 0);
    playTone(ctx, 920, 0.08, 0.045, 0.045);
  }

  function playPageSound(){
    var ctx = getAudioCtx();
    if(!ctx) return;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    var t0 = ctx.currentTime;
    osc.type = 'sine';
    osc.frequency.setValueAtTime(480, t0);
    osc.frequency.exponentialRampToValueAtTime(200, t0 + 0.22);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.05, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.24);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + 0.26);
  }

  var typeNoiseBuffer = null;
  function getTypeNoiseBuffer(ctx){
    if(!typeNoiseBuffer || typeNoiseBuffer.sampleRate !== ctx.sampleRate){
      var len = Math.floor(ctx.sampleRate * 0.05);
      typeNoiseBuffer = ctx.createBuffer(1, len, ctx.sampleRate);
      var data = typeNoiseBuffer.getChannelData(0);
      for(var i=0;i<len;i++){ data[i] = Math.random()*2-1; }
    }
    return typeNoiseBuffer;
  }

  function playTypeTick(){
    var ctx = getAudioCtx();
    if(!ctx) return;
    var t0 = ctx.currentTime;

    var src = ctx.createBufferSource();
    src.buffer = getTypeNoiseBuffer(ctx);
    var filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 1800 + Math.random()*1400;
    filter.Q.value = 0.6;
    var nGain = ctx.createGain();
    nGain.gain.setValueAtTime(0.0001, t0);
    nGain.gain.exponentialRampToValueAtTime(0.4, t0 + 0.002);
    nGain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.022);
    src.connect(filter);
    filter.connect(nGain);
    nGain.connect(ctx.destination);
    src.start(t0);
    src.stop(t0 + 0.03);

    var osc = ctx.createOscillator();
    var oGain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.value = 120 + Math.random()*50;
    oGain.gain.setValueAtTime(0.0001, t0);
    oGain.gain.exponentialRampToValueAtTime(0.05, t0 + 0.002);
    oGain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.025);
    osc.connect(oGain);
    oGain.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + 0.03);
  }

  var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function typewriterText(el, text){
    if(reducedMotion){ el.textContent = text; return; }
    var i = 0;
    var timer = setInterval(function(){
      i++;
      el.textContent = text.slice(0, i);
      if(i >= text.length){ clearInterval(timer); }
    }, 16);
  }

  function escapeHtml(ch){
    if(ch === '&') return '&amp;';
    if(ch === '<') return '&lt;';
    if(ch === '>') return '&gt;';
    return ch;
  }

  function parseKwHtml(html){
    var ranges = [];
    var plain = '';
    var re = /<b class="(kw|fill)">([\s\S]*?)<\/b>/g;
    var lastIndex = 0;
    var m;
    while((m = re.exec(html))){
      plain += html.slice(lastIndex, m.index);
      var start = plain.length;
      plain += m[2];
      ranges.push({start:start, end:plain.length, cls:m[1]});
      lastIndex = re.lastIndex;
    }
    plain += html.slice(lastIndex);
    return { plain: plain, ranges: ranges };
  }

  function inKwRange(i, ranges){
    for(var k=0;k<ranges.length;k++){ if(i >= ranges[k].start && i < ranges[k].end) return ranges[k].cls; }
    return null;
  }

  function fillTemplate(template, fillText){
    return template.replace('_____', '<b class="fill">'+fillText+'</b>');
  }

  function renderRevealHtml(plain, ranges, revealedCount){
    var visible = plain.slice(0, revealedCount);
    var out = '';
    var openCls = null;
    for(var i=0;i<visible.length;i++){
      var cls = inKwRange(i, ranges);
      if(cls !== openCls){
        if(openCls){ out += '</b>'; }
        if(cls){ out += '<b class="'+cls+'">'; }
        openCls = cls;
      }
      out += escapeHtml(visible.charAt(i));
    }
    if(openCls){ out += '</b>'; }
    return out;
  }

  function revealLine(el, html, charMs, onDone, checkpoints){
    var parsed = parseKwHtml(html);
    var total = parsed.plain.length;
    var revealed = 0;
    var cpIdx = 0;
    var timer = setInterval(function(){
      revealed++;
      el.innerHTML = renderRevealHtml(parsed.plain, parsed.ranges, revealed);
      var scrollHost = (el.closest && (el.closest('.deliv-scroll') || el.closest('.speech-bubble'))) || el;
      scrollHost.scrollTop = scrollHost.scrollHeight;
      var ch = parsed.plain.charAt(revealed-1);
      if(ch && !/\s/.test(ch)){ playTypeTick(); }
      if(checkpoints){
        while(cpIdx < checkpoints.length && revealed >= checkpoints[cpIdx].offset){
          checkpoints[cpIdx].fn();
          cpIdx++;
        }
      }
      if(revealed >= total){
        clearInterval(timer);
        if(onDone){ onDone(); }
      }
    }, charMs);
  }

  function buildFolderOptions(section, chosenIndex, order){
    var chips = order.map(function(realIndex, pos){
      var o = section.options[realIndex];
      var letter = String.fromCharCode(65+pos);
      var cls = 'bubble-chip' + (realIndex === chosenIndex ? ' chosen' : '');
      return '<button class="'+cls+'" data-i="'+realIndex+'"><span class="chip-tag">'+letter+'</span>'+o.fill+'</button>';
    }).join('');
    return '<div class="folder-options">'+chips+'</div>';
  }

  function buildFolderDoc(){
    return '<div class="folder-doc">' +
      '<div class="q-target" id="questionTextTarget"></div>' +
    '</div>';
  }

  var DELIVERY_ANCHOR = { x:34, y:9 };
  var DELIVERY_ASIDE_ANCHOR = { x:20, y:60 };

  function buildDeliveryBubble(){
    return '<div class="speech-bubble delivery" style="left:'+DELIVERY_ANCHOR.x+'%;top:'+DELIVERY_ANCHOR.y+'%;">' +
      '<div class="bubble-tail"></div>' +
      '<div class="deliv-scroll">' +
        '<span class="deliv-tag">'+t('deliveryEyebrow')+'</span>' +
        '<span id="deliverySpeech"></span>' +
      '</div>' +
    '</div>';
  }

  function buildDeliveryAsideHost(){
    return '<div class="delivery-aside-host" id="deliveryAsideHost" style="left:'+DELIVERY_ASIDE_ANCHOR.x+'%;top:'+DELIVERY_ASIDE_ANCHOR.y+'%;"></div>';
  }

  var state = { screen:'cover', idx:0, lang:'en', answers:new Array(SECTIONS.en.length).fill(null) };
  var lastQuestionKey = null;

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
    }
    return a;
  }
  var optionOrder = [];
  function buildOptionOrder(){
    optionOrder = SECTIONS.en.map(function(s){ return shuffle(s.options.map(function(o,i){ return i; })); });
  }
  buildOptionOrder();

  var app = document.getElementById('app');

  function go(screen){
    state.screen = screen;
    render();
    window.scrollTo({top:0, behavior:'auto'});
  }

  var langToggle = document.getElementById('langToggle');
  langToggle.onclick = function(){
    state.lang = state.lang === 'en' ? 'th' : 'en';
    render();
  };

  function render(){
    langToggle.textContent = t('langLabel');
    if(state.screen === 'cover') return renderCover();
    if(state.screen === 'briefing') return renderBriefing();
    if(state.screen === 'section') return renderSection();
    if(state.screen === 'delivery') return renderDelivery();
    if(state.screen === 'results') return renderResults();
  }

  function renderCover(){
    app.innerHTML =
      '<div class="screen cover">' +
        buildHeroScene(null) +
        '<span class="eyebrow">'+t('coverEyebrow')+'</span>' +
        '<h1>'+t('coverTitle')+'</h1>' +
        '<p class="sub">'+t('coverSub')+'</p>' +
        '<button class="btn btn-primary" id="startBtn">'+t('coverStart')+'</button>' +
        '<p class="disclaimer">'+t('disclaimer')+'</p>' +
      '</div>';
    document.getElementById('startBtn').onclick = function(){ playPageSound(); go('briefing'); };
  }

  function renderBriefing(){
    var body =
      '<span class="eyebrow">'+t('briefEyebrow')+'</span>' +
      '<p>'+t('briefP1')+'</p>' +
      (t('briefP2') ? '<p>'+t('briefP2')+'</p>' : '') +
      '<div class="narrative-actions"><button class="btn btn-primary" id="beginBtn">'+t('briefStart')+'</button></div>';

    app.innerHTML =
      '<div class="screen">' +
        '<div class="dossier">' +
          buildHeroScene(buildNarrativeScene(body)) +
        '</div>' +
      '</div>';
    document.getElementById('beginBtn').onclick = function(){ playPageSound(); state.idx = 0; go('section'); };
  }

  function renderSection(){
    var s = curSections()[state.idx];
    var chosen = state.answers[state.idx];

    var topicLabel = s.kicker.indexOf('—') !== -1 ? s.kicker.split('—')[1].trim() : s.kicker;

    var actions =
      '<div class="folder-actions">' +
        '<button class="btn btn-ghost" id="backBtn">'+t('back')+'</button>' +
        '<button class="btn btn-primary" id="nextBtn" '+(chosen===null?'disabled':'')+'>' +
          (state.idx === curSections().length-1 ? t('yieldFloor') : t('continueBtn')) +
        '</button>' +
      '</div>';

    var folderHtml =
      '<div class="folder-scene">' +
        '<div class="folder-tab">'+topicLabel+'</div>' +
        '<div class="folder">' +
          '<div class="folder-punch a"></div><div class="folder-punch b"></div>' +
          buildFolderDoc() +
          buildFolderOptions(s, chosen, optionOrder[state.idx]) +
          actions +
        '</div>' +
      '</div>';

    app.innerHTML =
      '<div class="screen">' +
        '<div class="dossier">' +
          folderHtml +
        '</div>' +
      '</div>';

    var questionTarget = document.getElementById('questionTextTarget');
    if(questionTarget){
      var questionKey = state.lang + '|' + state.idx;

      if(chosen !== null){
        var filledHtml = fillTemplate(s.prompt, s.options[chosen].fill);
        if(questionKey !== lastQuestionKey){
          lastQuestionKey = questionKey;
          revealLine(questionTarget, filledHtml, 22);
        } else {
          var parsedFilled = parseKwHtml(filledHtml);
          questionTarget.innerHTML = renderRevealHtml(parsedFilled.plain, parsedFilled.ranges, parsedFilled.plain.length);
        }
      } else {
        if(questionKey !== lastQuestionKey){
          lastQuestionKey = questionKey;
          revealLine(questionTarget, s.prompt, 22);
        } else {
          var parsedTgt = parseKwHtml(s.prompt);
          questionTarget.innerHTML = renderRevealHtml(parsedTgt.plain, parsedTgt.ranges, parsedTgt.plain.length);
        }
      }
    }

    Array.prototype.forEach.call(app.querySelectorAll('.bubble-chip'), function(btn){
      btn.onclick = function(){
        playSelectSound();
        state.answers[state.idx] = parseInt(btn.getAttribute('data-i'),10);
        renderSection();
      };
    });
    document.getElementById('backBtn').onclick = function(){
      playPageSound();
      if(state.idx === 0){ go('briefing'); }
      else { state.idx -= 1; go('section'); }
    };
    document.getElementById('nextBtn').onclick = function(){
      if(state.answers[state.idx] === null) return;
      playPageSound();
      if(state.idx === curSections().length-1){ go('delivery'); }
      else { state.idx += 1; go('section'); }
    };
  }

  function computeScores(){
    var total = 0;
    curSections().forEach(function(s,i){
      var o = s.options[state.answers[i]];
      total += o.tags.acc;
    });
    return { total: total };
  }

  function gradeFor(total){
    var grades = t('grades');
    for(var i=0;i<grades.length;i++){
      if(total >= grades[i].min) return grades[i];
    }
    return grades[grades.length-1];
  }

  function reactionFor(total){
    var reactions = t('reactions');
    for(var i=0;i<reactions.length;i++){
      if(total >= reactions[i].min) return reactions[i].text;
    }
    return reactions[reactions.length-1].text;
  }

  function asideFor(idx, chosenIdx, acc){
    var pool = t(acc ? 'asideCorrect' : 'asideWrong');
    return pool[(idx + chosenIdx) % pool.length];
  }

  function buildSpeechData(){
    var parts = [t('speechOpen')];
    var checkpoints = [];
    var plainLen = parseKwHtml(t('speechOpen')).plain.length + 1;
    curSections().forEach(function(s,i){
      var opt = s.options[state.answers[i]];
      var filled = fillTemplate(s.speechPrompt, opt.fill);
      parts.push(filled);
      plainLen += parseKwHtml(filled).plain.length;
      checkpoints.push({ idx:i, offset:plainLen, acc:opt.tags.acc });
      plainLen += 1;
    });
    parts.push(t('speechClose'));
    return { html: parts.join(' '), checkpoints: checkpoints };
  }

  function buildSpeechText(){
    return buildSpeechData().html;
  }

  function popAside(hostEl, text){
    if(!hostEl) return;
    var old = hostEl.querySelector('.speech-bubble.aside');
    if(old){ old.remove(); }
    hostEl.insertAdjacentHTML('beforeend', '<div class="speech-bubble aside"><div class="bubble-tail"></div>'+text+'</div>');
  }

  function renderDelivery(){
    var sc = computeScores();
    var reaction = reactionFor(sc.total);

    var overlayHtml =
      buildDeliveryBubble() +
      buildDeliveryAsideHost() +
      '<div class="delivery-reaction" id="deliveryReaction"></div>' +
      '<div class="delivery-actions"><button class="btn btn-primary" id="seeResultsBtn">'+t('seeResultsBtn')+'</button></div>';

    app.innerHTML =
      '<div class="screen">' +
        '<div class="dossier">' +
          buildHeroScene(overlayHtml) +
          '<p class="disclaimer">'+t('disclaimer')+'</p>' +
        '</div>' +
      '</div>';

    var speechEl = document.getElementById('deliverySpeech');
    var reactionEl = document.getElementById('deliveryReaction');
    var asideHost = document.getElementById('deliveryAsideHost');
    var speechData = buildSpeechData();
    if(reducedMotion){
      speechEl.innerHTML = speechData.html;
      reactionEl.innerHTML = reaction;
    } else {
      var checkpoints = speechData.checkpoints.map(function(cp){
        return { offset: cp.offset, fn: function(){
          popAside(asideHost, asideFor(cp.idx, state.answers[cp.idx], cp.acc));
        } };
      });
      revealLine(speechEl, speechData.html, 50, function(){
        revealLine(reactionEl, reaction, 50);
      }, checkpoints);
    }

    document.getElementById('seeResultsBtn').onclick = function(){ playPageSound(); go('results'); };
  }

  function renderResults(){
    var sc = computeScores();
    var g = gradeFor(sc.total);

    var transcriptHtml = curSections().map(function(s,i){
      var opt = s.options[state.answers[i]];
      var topicLabel = s.kicker.indexOf('—') !== -1 ? s.kicker.split('—')[1].trim() : s.kicker;
      var filled = fillTemplate(s.prompt, opt.fill);
      var verdict = t('verdictLabels')[opt.tags.acc];
      return '<p><b style="display:block;font-family:\'Space Mono\',monospace;font-size:0.68rem;letter-spacing:0.05em;text-transform:uppercase;color:var(--rust);margin-bottom:5px;">'+t('qPrefix')+topicLabel+'</b>'+filled+'<br><i style="font-size:0.85rem;color:var(--ink-soft);">'+verdict+' — '+opt.note+'</i></p>';
    }).join('');

    var speechHtml = '<p>'+buildSpeechText()+'</p>';

    var epilogueHtml = t('epilogueHtml');

    var body =
      '<span class="eyebrow">'+t('resultsEyebrow')+'</span>' +
      '<div class="narrative-title">'+g.name+'</div>' +
      '<p class="score-line">'+t('scoreLabel')+' '+sc.total+' / 6</p>' +
      '<p>'+g.sub+'</p>' +
      '<div class="narrative-actions"><button class="btn btn-primary" id="speechBtn">'+t('speechBtn')+'</button></div>' +
      '<div class="narrative-actions">' +
        '<button class="btn btn-onphoto btn-ghost" id="transcriptBtn">'+t('transcriptBtn')+'</button>' +
        '<button class="btn btn-onphoto btn-ghost" id="epilogueBtn">'+t('epilogueBtn')+'</button>' +
      '</div>' +
      '<div class="narrative-actions"><button class="btn btn-primary" id="againBtn">'+t('againBtn')+'</button></div>';

    app.innerHTML =
      '<div class="screen">' +
        '<div class="dossier">' +
          buildHeroScene(buildNarrativeScene(body)) +
        '</div>' +
      '</div>';

    document.getElementById('speechBtn').onclick = function(){
      openModal(t('speechTitle'), speechHtml);
    };
    document.getElementById('transcriptBtn').onclick = function(){
      openModal(t('transcriptTitle'), transcriptHtml);
    };
    document.getElementById('epilogueBtn').onclick = function(){
      openModal(t('epilogueTitle'), epilogueHtml);
    };
    document.getElementById('againBtn').onclick = function(){
      state = { screen:'cover', idx:0, lang:state.lang, answers:new Array(curSections().length).fill(null) };
      buildOptionOrder();
      go('cover');
    };
  }

  render();
})();
</script>
